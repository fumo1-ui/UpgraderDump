    <script>
      (function () {
        var KEY = "up_mock_nickname";
        var inp = document.getElementById("up-mock-reg-nick");
        var now = document.getElementById("up-mock-reg-now");
        function updateNow() {
          var nick = null;
          try { nick = localStorage.getItem(KEY); } catch (e) {}
          var authed = false;
          try { authed = !!localStorage.getItem("auth_token"); } catch (e) {}
          if (authed) {
            now.textContent = nick ? "Аккаунт: " + nick : "Вы вошли (LocalTester)";
          } else {
            now.textContent = "Пока не вошёл";
          }
        }
        function login(nick) {
          if (!nick) nick = "Player" + Math.floor(Math.random() * 9000 + 1000);
          var token = "mock_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
          try { localStorage.setItem(KEY, nick); } catch (e) {}
          // Новый аккаунт начинается с пустого баланса и пустого инвентаря.
          try { localStorage.setItem("up_mock_balance", "0"); } catch (e) {}
          try { localStorage.setItem("up_mock_inventory", "[]"); } catch (e) {}
          var sep = window.location.search ? "&" : "?";
          window.location.href =
            window.location.pathname +
            sep +
            "token=" + encodeURIComponent(token) +
            "&refreshToken=" + encodeURIComponent("r" + token);
        }
        function logout() {
          try {
            localStorage.removeItem("auth_token");
            localStorage.removeItem("refresh_token");
            localStorage.removeItem(KEY);
            localStorage.setItem("up_mock_logged_out", "1");
          } catch (e) {}
          window.location.reload();
        }
        document.getElementById("up-mock-reg-enter").onclick = function () {
          login(inp.value.trim());
        };
        document.getElementById("up-mock-reg-random").onclick = function () {
          login("");
        };
        document.getElementById("up-mock-reg-logout").onclick = logout;
        // Пополнение баланса: любая сумма от 1 до 100000.
        var amtInp = document.getElementById("up-mock-topup-amt");
        function topUp() {
          var v = parseFloat(amtInp.value);
          if (!isFinite(v) || v <= 0) { amtInp.focus(); return; }
          v = Math.min(100000, v);
          var cur = parseFloat(localStorage.getItem("up_mock_balance") || "0") || 0;
          localStorage.setItem("up_mock_balance", (Math.round((cur + v) * 100) / 100).toString());
          window.location.reload();
        }
        document.getElementById("up-mock-topup-btn").onclick = topUp;
        amtInp.addEventListener("keydown", function (e) {
          if (e.key === "Enter") topUp();
        });
        inp.addEventListener("keydown", function (e) {
          if (e.key === "Enter") login(inp.value.trim());
        });
        updateNow();
        setTimeout(updateNow, 800);
        setTimeout(updateNow, 3000);
      })();
    </script>
